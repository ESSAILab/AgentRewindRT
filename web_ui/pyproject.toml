[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepxdr-web-ui"
version = "1.0.0"
description = "AgentGuard intelligent-agent security dashboard"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]
